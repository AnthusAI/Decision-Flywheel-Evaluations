[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-flywheel-evaluations"
version = "0.17.1"
description = "Reproducible evaluations for Decision Flywheel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "decision-flywheel @ git+https://github.com/AnthusAI/Decision-Flywheel.git@6137fa185a1a98afa84b5e6d5948d1780df5d56d",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["datasets>=2.0"]
jev-live = ["typesafe-sdk==0.7.1", "python-dotenv>=1,<2"]
tools = [
    "build>=1.2",
    "kanbus==0.33.0",
    "python-semantic-release>=10,<11",
]

[project.scripts]
decision-flywheel-evaluations = "decision_flywheel_evaluations.cli:main"

[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/decision_flywheel_evaluations/__init__.py:__version__"]
build_command = "python -m build"
upload_to_pypi = false
upload_to_vcs_release = true
allow_zero_version = true
major_on_zero = false
changelog_file = "CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
